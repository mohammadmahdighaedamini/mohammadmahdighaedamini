name: Update project timeline

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours; new repos show up by themselves
  workflow_dispatch:            # lets you run it by hand: Actions tab -> Run workflow
  push:
    paths:
      - generate_timeline.py    # re-draw when you change the script

permissions:
  contents: write               # needed to commit the new svg

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build assets/project-timeline.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 generate_timeline.py

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-timeline.svg
          git diff --cached --quiet || (git commit -m "Update project timeline" && git push)
